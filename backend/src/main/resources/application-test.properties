# Dados de conexão com o banco H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria o esquema do H2 e executa o import.sql.
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Configuração do cliente web do banco H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração para mostrar o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Credenciais do cliente OAuth para uso local
security.client-id=${SECURITY_CLIENT_ID:foody-local-client}
security.client-secret=${SECURITY_CLIENT_SECRET:foody-local-secret}
