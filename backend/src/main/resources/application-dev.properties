# PostgreSQL do devcontainer
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.contexts=dev
spring.h2.console.enabled=false

# Credenciais do cliente OAuth para desenvolvimento local
security.client-id=${SECURITY_CLIENT_ID:foody-local-client}
security.client-secret=${SECURITY_CLIENT_SECRET:foody-local-secret}
