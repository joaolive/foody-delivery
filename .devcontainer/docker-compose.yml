services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    volumes:
      - ../:/workspace
    command: sleep infinity
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spring-dev-network

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - spring-dev-network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - ../backend/.env
    profiles: ["tools"]
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - spring-dev-network

volumes:
  postgres18-data:

networks:
  spring-dev-network:
    driver: bridge
